<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Iara AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.png" alt="" width="20" height="20" />
        <span>IARA AI</span>
        <span class="status-dot" title="Online"></span>
      </div>
      <div class="topbar-actions">
        <button id="openTab" class="icon-btn" title="Abrir em nova aba">↗</button>
        <button id="openSettings" class="icon-btn" title="Configurar domínio">⚙</button>
      </div>
    </header>

    <!-- App embed (iframe carrega /iara do app real) -->
    <main id="view-main" class="view">
      <div class="iframe-shell">
        <div id="loader" class="loader">
          <div class="loader-bars"><i></i><i></i><i></i><i></i></div>
          <div class="loader-text">Conectando à Iara…</div>
        </div>
        <iframe
          id="appFrame"
          title="Iara AI"
          allow="clipboard-read; clipboard-write; autoplay"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </main>

    <!-- Settings overlay -->
    <main id="view-settings" class="view overlay hidden">
      <div class="settings-card">
        <h1>Domínio do app</h1>
        <p class="muted">
          Configure o domínio onde a Iara está hospedada (produção, staging ou
          domínio próprio).
        </p>
        <form id="domainForm" class="stack">
          <label>
            URL base
            <input
              id="domainInput"
              type="url"
              required
              placeholder="https://seu-dominio.com"
              autocomplete="off"
            />
          </label>
          <p class="hint" id="domainHint"></p>
          <div class="row">
            <button type="button" id="resetDomain" class="ghost">Padrão</button>
            <button type="submit" class="primary">Salvar e recarregar</button>
          </div>
          <p id="domainStatus" class="status hidden"></p>
        </form>
        <button id="backFromSettings" class="link back">← Voltar para a Iara</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
