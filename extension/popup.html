<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J.A.R.V.I.S.</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.png" alt="" width="20" height="20" />
        <span>J.A.R.V.I.S.</span>
        <span class="status-dot" title="Online"></span>
      </div>
      <div class="topbar-actions">
        <button id="reloadFrame" class="icon-btn" title="Recarregar">⟳</button>
        <button id="openTab" class="icon-btn" title="Abrir em nova aba">↗</button>
        <button id="openSettings" class="icon-btn" title="Configurar domínio">⚙</button>
      </div>
    </header>

    <main id="view-main" class="view">
      <div class="iframe-shell">
        <div id="preloader" class="preloader">
          <video
            id="preloaderVideo"
            src="preloader.mp4"
            autoplay
            muted
            playsinline
            preload="auto"
          ></video>
        </div>
        <iframe
          id="appFrame"
          title="J.A.R.V.I.S."
          allow="clipboard-read; clipboard-write; autoplay; microphone; camera"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </main>

    <main id="view-settings" class="view overlay hidden">
      <div class="settings-card">
        <h1>Domínio do JARVIS</h1>
        <p class="muted">
          Aponte a extensão para a URL onde seu JARVIS está rodando (ex: produção no Vercel ou local em http://localhost:5173).
        </p>
        <p class="muted" style="color: #38bdf8; font-size: 11px; margin-top: -6px;">
          💡 <strong>Viu o Erro 404?</strong> Certifique-se de preencher a URL base com o endereço correto do seu deploy e selecione a rota <strong>/jarvis</strong> ou <strong>/</strong>.
        </p>
        <form id="domainForm" class="stack">
          <label>
            URL base
            <input
              id="domainInput"
              type="url"
              required
              placeholder="https://seu-dominio.com"
              autocomplete="off"
            />
          </label>
          <label>
            Rota inicial
            <input
              id="pathInput"
              type="text"
              placeholder="/jarvis"
              autocomplete="off"
            />
          </label>
          <div class="row" style="gap: 4px; flex-wrap: wrap; margin-top: 4px;">
            <button type="button" id="btnLocalhost" class="ghost" style="font-size: 11px; padding: 4px 8px;">Local (5173)</button>
            <button type="button" id="btnRouteJarvis" class="ghost" style="font-size: 11px; padding: 4px 8px;">Rota /jarvis</button>
            <button type="button" id="btnRouteRoot" class="ghost" style="font-size: 11px; padding: 4px 8px;">Rota /</button>
          </div>
          <p class="hint" id="domainHint"></p>
          <div class="row">
            <button type="button" id="resetDomain" class="ghost">Padrão</button>
            <button type="submit" class="primary">Salvar e recarregar</button>
          </div>
          <p id="domainStatus" class="status hidden"></p>
        </form>
        <button id="backFromSettings" class="link back">← Voltar ao JARVIS</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
